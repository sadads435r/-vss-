<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>每日活动日志</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#0b0e14;color:#eef2f6;--green:#76b900;--panel:#151a23;--border:#2a3240;--muted:#9aa5b4}
    *{box-sizing:border-box}body{margin:0 auto;padding:28px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}h1,h2,h3{margin:0}h1{font-size:30px}h2{font-size:20px;margin-bottom:14px}a{color:#8bd000}.muted{color:var(--muted)}.error{color:#ff7b7b}.hidden{display:none!important}
    .panel,.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.toolbar label{display:grid;gap:5px;font-size:13px;color:var(--muted)}button,input,select{font:inherit;border-radius:8px;padding:9px 11px}button{border:0;background:var(--green);color:#081006;font-weight:750;cursor:pointer}button.secondary{background:#29313e;color:#eef2f6}input,select{border:1px solid #3a4556;background:#0f131b;color:#eef2f6}input[type=search]{min-width:230px}.check{display:flex!important;grid-template-columns:auto auto!important;align-items:center;gap:7px!important;padding:8px 0}.check input{width:17px;height:17px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px;margin:14px 0 24px}.metric{font-size:28px;font-weight:800;margin-top:7px}.section{margin-top:24px}.timeline-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.timeline-scale{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:#718094;margin-left:130px;margin-top:12px}.timeline-scale span:last-child{text-align:right}.timeline-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin:10px 0}.timeline-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{position:relative;height:34px;border-radius:8px;background:repeating-linear-gradient(90deg,#111720 0,#111720 calc(100% / 6 - 1px),#26303e calc(100% / 6 - 1px),#26303e calc(100% / 6));overflow:hidden}.segment{position:absolute;top:4px;height:26px;min-width:3px;border-radius:5px;opacity:.92;cursor:help}.ongoing{box-shadow:0 0 0 2px #fff7 inset}
    .events{display:grid;gap:10px}.event{display:grid;grid-template-columns:120px 150px minmax(220px,1fr) 120px 90px;gap:14px;align-items:center;padding:13px 14px;background:#111720;border:1px solid #252f3d;border-left:5px solid var(--event-color);border-radius:10px}.time{font-variant-numeric:tabular-nums;font-weight:750}.badge{display:inline-flex;width:max-content;border-radius:99px;padding:4px 8px;background:#29313e;font-size:12px}.confidence{color:var(--muted);font-size:13px}.empty{padding:34px;text-align:center;color:var(--muted)}
    details{margin-top:28px}summary{cursor:pointer;font-size:20px;font-weight:750;padding:14px 0}.settings-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(400px,2fr);gap:18px}.people-grid{display:flex;gap:12px;flex-wrap:wrap}.person-card{width:150px;padding:10px;text-align:center}.person-card img{width:128px;height:110px;object-fit:cover;border-radius:8px;background:#202734}.person-actions{display:flex;gap:6px;justify-content:center;margin-top:8px}.person-actions button{padding:5px 8px;font-size:12px}.danger{background:#ff6b6b;color:#fff}#roi-wrap{position:relative;display:inline-block;max-width:100%}#frame{max-width:100%;max-height:520px;display:block}#roi{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
    @media(max-width:850px){body{padding:16px}header{flex-direction:column}.metrics{grid-template-columns:1fr}.timeline-scale{margin-left:100px}.timeline-row{grid-template-columns:90px 1fr}.event{grid-template-columns:1fr 1fr}.event .description{grid-column:1/-1;grid-row:2}.settings-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div><h1>每日活动日志</h1><div class="muted">由本地摄像头与 Cosmos3 自动生成；只描述画面中能够确认的活动。</div></div>
    <a href="/">打开 VSS Agent</a>
  </header>

  <section class="panel">
    <div class="toolbar">
      <button class="secondary" onclick="moveDate(-1)" aria-label="前一天">←</button>
      <label>日期<input id="date" type="date" onchange="loadActivities()"></label>
      <button class="secondary" onclick="moveDate(1)" aria-label="后一天">→</button>
      <button class="secondary" onclick="goToday()">今天</button>
      <label>人员<select id="person" onchange="loadActivities()"><option value="">全部人员</option></select></label>
      <label>关键词<input id="query" type="search" placeholder="例如：阅读、交谈" onkeydown="if(event.key==='Enter')loadActivities()"></label>
      <label class="check"><input id="only-ongoing" type="checkbox" onchange="renderActivities()">仅进行中</label>
      <button onclick="loadActivities()">查询</button>
    </div>
    <div id="message" class="muted">正在读取活动日志…</div>
  </section>

  <section class="metrics">
    <div class="card"><div class="muted">当前工作人数</div><div id="working-count" class="metric">--</div></div>
    <div class="card"><div class="muted">当天事件</div><div id="event-count" class="metric">--</div></div>
    <div class="card"><div class="muted">已记录活动时间</div><div id="total-time" class="metric">--</div></div>
  </section>

  <section class="panel section">
    <div class="timeline-head"><h2>一天时间线</h2><span class="muted">00:00–24:00</span></div>
    <div class="timeline-scale"><span>00:00</span><span>04:00</span><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span><span>24:00</span></div>
    <div id="timeline"><div class="empty">暂无活动</div></div>
  </section>

  <section class="panel section">
    <h2>事件明细</h2>
    <div id="events" class="events"><div class="empty">暂无活动</div></div>
  </section>

  <details id="settings">
    <summary>人员与摄像头设置</summary>
    <div class="settings-grid">
      <section class="panel">
        <h2>人员库</h2>
        <p class="muted">系统自动将多个检测编号归并为同一个人。可在这里重命名或停用人员。</p>
        <div id="people-grid" class="people-grid"></div>
      </section>
      <section class="panel">
        <h2>椅子 ROI 标定</h2>
        <p class="muted">点击画面左上角和右下角，只框住椅子或坐姿区域。</p>
        <div id="roi-wrap"><img id="frame" alt="摄像头当前帧"><canvas id="roi"></canvas></div>
        <div class="controls"><button onclick="reloadFrame()">刷新画面</button><button class="secondary" onclick="resetRoi()">重新画框</button><button onclick="saveRoi()">保存 ROI</button><span id="roi-message" class="muted"></span></div>
      </section>
    </div>
  </details>

<script>
const api='/office-api';
const colors={computer:'#76b900',reading:'#25b7d3',writing:'#8b7cff',phone:'#ff9f43',conversation:'#ef6caa',eating:'#f5a623',rest:'#9aa5b4',unknown:'#4d5766'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const duration=value=>{let s=Math.max(0,Math.round(value||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}小时${m}分`:m?`${m}分${s%60}秒`:`${s}秒`};
const clock=value=>new Date(value*1000).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});
const localDate=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`};
async function json(url,options){const response=await fetch(url,{cache:'no-store',...options});const data=await response.json();if(!response.ok)throw new Error(data.error||response.statusText);return data}

let activityData={events:[],people:[],start:'',end:'',event_count:0,total_seconds:0};
function filteredEvents(){return document.querySelector('#only-ongoing').checked?activityData.events.filter(event=>event.ongoing):activityData.events}
async function loadActivities(){
  const message=document.querySelector('#message');message.textContent='正在读取活动日志…';message.className='muted';
  const params=new URLSearchParams({date:document.querySelector('#date').value});
  const person=document.querySelector('#person').value,query=document.querySelector('#query').value.trim();if(person)params.set('person_id',person);if(query)params.set('q',query);
  try{activityData=await json(`${api}/api/activity/events?${params}`);message.textContent=`时区 ${activityData.timezone} · 数据由模型自动判断，建议结合实际情况理解`;renderActivities()}catch(error){message.textContent=`读取失败：${error.message}`;message.className='error';activityData={events:[],people:[],event_count:0,total_seconds:0};renderActivities()}
}
function renderActivities(){
  const events=filteredEvents();document.querySelector('#event-count').textContent=events.length;document.querySelector('#total-time').textContent=duration(events.reduce((sum,event)=>sum+event.duration_seconds,0));
  const timeline=document.querySelector('#timeline'),list=document.querySelector('#events');
  if(!events.length){timeline.innerHTML='<div class="empty">这一天没有符合条件的活动记录</div>';list.innerHTML='<div class="empty">暂无事件</div>';return}
  const dayStart=new Date(activityData.start).getTime()/1000,dayEnd=new Date(activityData.end).getTime()/1000,span=Math.max(1,dayEnd-dayStart);
  const groups=new Map();events.forEach(event=>{const key=event.person_id??`track:${event.track_id}`;if(!groups.has(key))groups.set(key,{name:event.person_name,events:[]});groups.get(key).events.push(event)});
  timeline.innerHTML=[...groups.values()].map(group=>`<div class="timeline-row"><div class="timeline-name" title="${esc(group.name)}">${esc(group.name)}</div><div class="track">${group.events.map(event=>{const left=Math.max(0,(event.started_at-dayStart)/span*100),width=Math.max(.25,(event.ended_at-event.started_at)/span*100),color=colors[event.activity]||colors.unknown;return `<div class="segment ${event.ongoing?'ongoing':''}" title="${clock(event.started_at)}–${clock(event.ended_at)} ${esc(event.description)}" style="left:${left}%;width:${width}%;background:${color}"></div>`}).join('')}</div></div>`).join('');
  list.innerHTML=events.map(event=>{const color=colors[event.activity]||colors.unknown;return `<article class="event" style="--event-color:${color}"><div class="time">${clock(event.started_at)}–${event.ongoing?'进行中':clock(event.ended_at)}</div><div><span class="badge">${esc(event.activity_label)}</span></div><div class="description"><b>${esc(event.person_name)}</b><div>${esc(event.description)}</div></div><div>${duration(event.duration_seconds)}</div><div class="confidence" title="${event.observation_count} 次有效观察">置信度 ${Math.round(event.confidence*100)}%</div></article>`}).join('');
}
function moveDate(days){const input=document.querySelector('#date'),date=new Date(`${input.value}T12:00:00+08:00`);date.setUTCDate(date.getUTCDate()+days);input.value=date.toISOString().slice(0,10);loadActivities()}
function goToday(){document.querySelector('#date').value=localDate();loadActivities()}
async function loadPeople(){
  const select=document.querySelector('#person'),grid=document.querySelector('#people-grid');let data;try{data=await json(`${api}/api/people`)}catch(error){grid.innerHTML=`<span class="error">${esc(error.message)}</span>`;return}
  const selected=select.value;select.innerHTML='<option value="">全部人员</option>'+data.people.map(p=>`<option value="${p.person_id}">${esc(p.name)}</option>`).join('');select.value=selected;
  grid.innerHTML=data.people.length?data.people.map(p=>`<div class="card person-card"><img src="${api}/api/people/${p.person_id}/image" alt="${esc(p.name)}"><div style="margin:7px 0;font-weight:700">${esc(p.name)}</div><div class="muted" style="font-size:12px">${p.track_count} 个检测编号</div><div class="person-actions"><button onclick="renamePerson(${p.person_id})">改名</button><button class="danger" onclick="deletePerson(${p.person_id})">停用</button></div></div>`).join(''):'<span class="muted">尚未识别到人员</span>';
}
async function loadWorkingCount(){try{const data=await json(`${api}/api/person/activity/today`);document.querySelector('#working-count').textContent=data.working_count}catch{document.querySelector('#working-count').textContent='--'}}
async function renamePerson(id){const name=prompt('输入新名称');if(!name)return;await json(`${api}/api/people/${id}/name`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});await loadPeople();await loadActivities()}
async function deletePerson(id){if(!confirm('确认停用该人员并删除当前检测编号映射？历史活动仍会保留。'))return;await json(`${api}/api/people/${id}`,{method:'DELETE'});await loadPeople();await loadActivities()}

const img=document.querySelector('#frame'),canvas=document.querySelector('#roi'),ctx=canvas.getContext('2d');let roi=[],clicks=[],settingsLoaded=false;
function draw(){canvas.width=img.clientWidth;canvas.height=img.clientHeight;ctx.clearRect(0,0,canvas.width,canvas.height);if(roi.length){ctx.strokeStyle='#76b900';ctx.lineWidth=3;ctx.fillStyle='#76b90033';ctx.beginPath();roi.forEach((point,index)=>(index?ctx.lineTo(...point):ctx.moveTo(...point)));ctx.closePath();ctx.fill();ctx.stroke()}}
async function loadRoi(){const data=await json(`${api}/api/workstation/roi`);roi=data.chair_roi.map(point=>[point[0]*img.clientWidth,point[1]*img.clientHeight]);draw()}
async function reloadFrame(){img.src=`${api}/api/workstation/frame?t=${Date.now()}`;img.onload=()=>loadRoi().catch(()=>{})}
function resetRoi(){roi=[];clicks=[];draw();document.querySelector('#roi-message').textContent='请点击左上角和右下角'}
canvas.onclick=event=>{if(clicks.length>=2)return;const rect=canvas.getBoundingClientRect();clicks.push([(event.clientX-rect.left)/rect.width,(event.clientY-rect.top)/rect.height]);if(clicks.length===2){const [a,b]=clicks,l=Math.min(a[0],b[0]),r=Math.max(a[0],b[0]),t=Math.min(a[1],b[1]),bt=Math.max(a[1],b[1]);roi=[[l*canvas.width,t*canvas.height],[r*canvas.width,t*canvas.height],[r*canvas.width,bt*canvas.height],[l*canvas.width,bt*canvas.height]];draw()}};
async function saveRoi(){if(roi.length<3){document.querySelector('#roi-message').textContent='请先画框';return}const normalized=roi.map(point=>[Number((point[0]/canvas.width).toFixed(4)),Number((point[1]/canvas.height).toFixed(4))]);await json(`${api}/api/workstation/roi`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({chair_roi:normalized})});document.querySelector('#roi-message').textContent='已保存'}
document.querySelector('#settings').addEventListener('toggle',event=>{if(event.target.open&&!settingsLoaded){settingsLoaded=true;loadPeople();reloadFrame()}});window.onresize=draw;
document.querySelector('#date').value=localDate();loadPeople();loadWorkingCount();loadActivities();setInterval(()=>{loadWorkingCount();if(document.querySelector('#date').value===localDate())loadActivities()},15000);
</script>
</body>
</html>
