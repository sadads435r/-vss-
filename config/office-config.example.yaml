version: 1
timezone: Asia/Hong_Kong

camera:
  id: office-main
  name: Office Main Camera
  # Optional: set this to the sensorId emitted by VSS when more than one camera exists.
  vss_sensor_id: ""
  rtsp_url: rtsp://127.0.0.1:8554/office-main
  resolution: [1920, 1080]
  fps: 10

occupancy:
  poll_seconds: 2
  departure_timeout_seconds: 10
  minimum_person_confidence: 0.3
  history_limit: 100

workstation:
  enabled: true
  id: desk-main
  name: Main Workstation
  # Normalized polygon covering only the chair/seat. Calibrate it in the Web UI.
  chair_roi:
    - [0.35, 0.25]
    - [0.75, 0.25]
    - [0.75, 0.95]
    - [0.35, 0.95]
  sample_seconds: 20
  # Per-person activity sampling and event-change confirmation.
  person_sample_seconds: 10
  departure_seconds: 60
  state_confirmation_samples: 2
  minimum_activity_confidence: 0.6
  frame_stale_seconds: 15
  focused_activities: [computer, reading, writing]
  activities: [computer, reading, writing, phone, conversation, rest, unknown]
  cosmos3_url: http://127.0.0.1:8018
  cosmos3_model: auto
  report_retention_days: 365
  event_clip_retention_days: 7
  # Continuous pose/motion pipeline. Set enabled: false to use the legacy
  # per-person single-image classifier above.
  motion_pipeline:
    enabled: true
    pose_source: mediapipe
    mediapipe_pose_model: /models/mediapipe/pose_landmarker_lite.task
    pose_frame_tolerance_seconds: 1.5
    window_seconds: 8
    step_seconds: 2
    semantic_interval_seconds: 10
    minimum_semantic_interval_seconds: 5
    pose_minimum_confidence: 0.35
    frame_buffer_seconds: 120
    frame_buffer_fps: 2
    person_storyboard_frames: 6
    scene_storyboard_frames: 4
    storyboard_retention_days: 7
    queue_limit: 100
    mediapipe_hand_model: /models/mediapipe/hand_landmarker.task
  identity:
    confirmation_samples: 2
    cosmos_match_confidence: 0.85
    strong_match_confidence: 0.95
    strong_reid_similarity: 0.80
    candidate_limit: 3
    gallery_limit: 5
    minimum_image_height: 256
    minimum_detection_confidence: 0.7
    minimum_visible_keypoints_ratio: 0.8
    gallery_diversity_similarity: 0.95

schedule:
  weekdays: [monday, tuesday, wednesday, thursday, friday]
  start: "09:00"
  end: "20:00"
  holidays: []

retention:
  event_days: 7
  transient_buffer_seconds: 120
  clip_before_seconds: 10
  clip_after_seconds: 20
  maximum_storage_gb: 30

rules:
  after_hours_presence:
    enabled: true
  restricted_zone_entry:
    enabled: false
  dwell_time:
    enabled: false
    seconds: 120
  occupancy_limit:
    enabled: true
    maximum_people: 10

# Coordinates are normalized into the [0, 1] range. Replace these examples
# after viewing the actual camera image.
zones:
  - id: restricted-area
    name: Restricted Area
    restricted: false
    polygon:
      - [0.15, 0.15]
      - [0.95, 0.15]
      - [0.95, 0.95]
      - [0.15, 0.95]
